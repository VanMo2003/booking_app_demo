name: booking_app_mobile
description: Mobile app generated from Postman collection (Booking App BE API)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.7.0
  retrofit: 4.9.0
  auto_route: ^10.1.0+1
  shared_preferences: ^2.3.2
  get_it: ^8.2.0
  json_annotation: ^4.9.0
  injectable: ^2.1.2
  intl: ^0.20.2
  slang: ^4.11.1
  slang_flutter: ^4.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.7.0
  injectable_generator: ^2.1.2
  auto_route_generator: ^10.1.0
  flutter_gen_runner: ^5.4.0
  freezed: ^2.3.2
  retrofit_generator: ^9.7.0
  flutter_bloc: ^9.1.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
